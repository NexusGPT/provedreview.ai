# Builds the site and deploys it to GitHub Pages on every push to main.
# SITE_BASE: "/" once the custom domain is attached (docs/DEPLOY.md); "/<repository>/" on the plain Pages URL before it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/build.mjs --check
      - run: node scripts/links.mjs dist --base "$SITE_BASE"
      - run: node scripts/validate.mjs dist
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
