<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q3: headline only</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap">
<style>
:root{--sans:"Inter",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--serif:"Source Serif 4",Georgia,serif;--bg:#07080b;--fg:#e9eaee;--mut:#8b90a0;--line:rgba(255,255,255,.07);--steel:#9fb3c8;--cream:#f3efe6;--wit:#f0a08c;--ok:#8fd3b4;--ask:#e6c37a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(159,179,200,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(159,179,200,.07) 1px,transparent 1px);background-size:26px 26px}
#ascii{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
#glow{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;filter:blur(28px) saturate(1.25);opacity:.8;transform:translateZ(0)}
#far{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;filter:blur(1.2px);opacity:.42}
#near{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;filter:blur(.4px);opacity:.9;pointer-events:none}
#glass{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
#scrim{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(620px 380px at 50% 50%,rgba(7,8,11,.88),rgba(7,8,11,.4) 66%,transparent 100%)}
.nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 48px;font-size:14px}
.logo{font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}.logo .mark{display:grid;grid-template-columns:repeat(3,7px);gap:1px}.logo .mark i{display:block;width:7px;height:7px;background:var(--steel);border-radius:1px;opacity:.9}.logo .mark i:nth-child(2),.logo .mark i:nth-child(4),.logo .mark i:nth-child(9){opacity:.35}
.links{display:flex;gap:28px;color:var(--mut)}.links a:hover{color:var(--fg)}
.btn{font-size:13.5px;padding:9px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:500;border:1px solid var(--line);background:rgba(255,255,255,.04)}.btn.p{background:var(--fg);color:#07080b;border-color:var(--fg)}
.hero{position:relative;z-index:2;min-height:calc(100vh - 62px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px 100px}
.plate{position:relative;width:min(820px,100%);padding:40px 48px 32px;border-radius:24px;display:flex;flex-direction:column;align-items:center}
.lemma{font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--mut);max-width:64ch;margin:26px 0 0;display:flex;gap:12px;align-items:flex-start;text-align:left}
.lemma .bar{flex:0 0 2px;width:2px;height:34px;background:linear-gradient(180deg,var(--ok),transparent);margin-top:2px;border-radius:2px}
.lemma i{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--cream)}.lemma sub{font-size:9px;margin:0 1px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-size:62px;line-height:1.04;letter-spacing:-.035em;font-weight:500;margin:22px 0 16px;max-width:16ch}
h1 .g{background:linear-gradient(90deg,#f3efe6 0%,#b7c6dc 45%,#b7a7f0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.math-unused{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--cream);margin:0 0 20px;opacity:.9}.math sub{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--steel);margin:0 2px}.math .q{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--mut);margin-left:14px;letter-spacing:.04em}
.sub{font-size:18px;line-height:1.5;color:#c7ccd6;max-width:50ch;margin:0 0 30px}
.box{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(10,11,15,.85);backdrop-filter:blur(10px);border-radius:14px;padding:10px 10px 10px 18px;font-family:var(--mono);font-size:13.5px;box-shadow:0 30px 80px -40px rgba(159,179,200,.35)}
.box span{color:var(--fg)}.box .k{color:var(--mut);font-size:11px;margin-left:auto;padding-right:6px}
.slash{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}.slash a{font-family:var(--mono);font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:rgba(10,11,15,.7)}.slash a:hover{color:var(--fg)}
.stats{display:flex;gap:44px;margin-top:40px;font-family:var(--mono);font-size:12px;color:var(--mut)}.stats b{display:block;font-family:var(--sans);font-size:22px;letter-spacing:-.02em;color:var(--fg);margin-bottom:4px;font-weight:600}
.reveal{opacity:0;transform:translateY(14px);animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
.reveal:nth-child(2){animation-delay:.1s}.reveal:nth-child(3){animation-delay:.2s}.reveal:nth-child(4){animation-delay:.3s}.reveal:nth-child(5){animation-delay:.4s}.reveal:nth-child(6){animation-delay:.5s}.reveal:nth-child(7){animation-delay:.6s}
@keyframes up{to{opacity:1;transform:none}}
@media (max-width:960px){h1{font-size:40px}.links{display:none}.stats{gap:22px;flex-wrap:wrap;justify-content:center}}

.hero h1{font-size:92px;line-height:.98;font-weight:500;letter-spacing:-.04em;max-width:11ch;margin:20px 0 22px}.sub{font-size:20px;color:#c7ccd6;max-width:40ch;margin:0 0 30px}.stats{display:none}#scrim{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(700px 380px at 50% 50%,rgba(7,8,11,.88),rgba(7,8,11,.35) 65%,transparent 100%)}</style></head><body>
<canvas id="far" aria-hidden="true"></canvas><canvas id="glow" aria-hidden="true"></canvas><canvas id="ascii" aria-hidden="true"></canvas><canvas id="near" aria-hidden="true"></canvas><canvas id="glass" aria-hidden="true"></canvas>
<div class="nav"><a class="logo" href="#"><span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>provedreview</a><div class="links"><a>Method</a><a>lean</a><a>Benchmark</a><a>Quick start</a><a>Paper</a></div><div style="display:flex;gap:10px"><a class="btn">GitHub</a><a class="btn p">Get started</a></div></div>
<div id="scrim"></div><main class="hero"><span class="kicker reveal"><i></i>differential attestation</span><h1 class="reveal">Deterministic <span class="g">code review</span>.</h1><p class="sub reveal">A proof, or the input that breaks it. Never an opinion.</p><div style="display:flex;gap:10px" class="reveal"><a class="btn p">Quick start →</a><a class="btn">Read the method</a></div></main>
<script src="/variants/engine.js"></script>
</body></html>
